name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  IMAGES: src/Koch.Gateway=kochbuch-gateway src/Koch.Api=kochbuch-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ['10000:10000']
    env:
      KOCH_TEST_STORAGE: UseDevelopmentStorage=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - run: dotnet test -c Release --blame-hang-timeout 3m
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null && az bicep lint --file infra/main.bicep

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      KOCH_MEMBERS: ${{ secrets.KOCH_MEMBERS }}
      KOCH_SIGNIN_CLIENT_ID: ${{ vars.KOCH_SIGNIN_CLIENT_ID }}
      KOCH_BUDGET_START: ${{ vars.KOCH_BUDGET_START }}
      KOCH_BUDGET_EMAILS: ${{ secrets.KOCH_BUDGET_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        env:
          KOCH_IMAGE_TAG: ${{ github.sha }}
        run: |
          for entry in $IMAGES; do
            project="${entry%%=*}"; image="${entry#*=}"
            dotnet publish "$project" -c Release -r linux-x64 -t:PublishContainer \
              -p:ContainerRegistry=ghcr.io -p:ContainerRepository="${{ github.repository_owner }}/$image" \
              -p:ContainerImageTags="$KOCH_IMAGE_TAG"
          done
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure
        id: deploy
        env:
          KOCH_IMAGE_TAG: ${{ github.sha }}
        run: |
          outputs=$(az deployment group create --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "kochbuch-${{ github.run_number }}" \
            --template-file infra/main.bicep --parameters infra/main.bicepparam \
            --query properties.outputs --output json)
          echo "url=https://$(jq -r .gatewayFqdn.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "media=$(jq -r .mediaFunctionName.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
      - name: Deploy Media function
        run: dotnet publish src/Koch.Media -c Release -r linux-x64 --self-contained false -o media
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ steps.deploy.outputs.media }}
          package: media
          sku: flexconsumption
      - name: Smoke check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 18); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz")" = 200 ] && break
            sleep 10
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz")" = 200 ]
          curl -fsS "$URL/" | grep -q '<title>Kochbuch'
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/whoami")" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/recipes/status")" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/shopping/sync")" = 401 ]
